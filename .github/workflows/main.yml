
name: Сборка WrapVision APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Собрать приложение
        working-directory: github/workflows
        run: gradle assembleDebug --stacktrace --info

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WrapVision-APK
          path: github/workflows/app/build/outputs/apk/debug/app-debug.apk
